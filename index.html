<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>EXILED AI</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',system-ui,sans-serif}
:root{--bg0:#000;--bg1:#0a0a0a;--bg2:#111;--bg3:#1a1a1a;--bd:#222;--bd2:#2a2a2a;--tx:#fff;--dim:#888;--dim2:#555;--grad:linear-gradient(135deg,#fff,#888);--gradh:linear-gradient(135deg,#e5e5e5,#aaa);--red:#ff4d4d}
body{background:var(--bg0);color:var(--tx);height:100vh;overflow:hidden;background-image:radial-gradient(circle at 15% 10%,rgba(255,255,255,.05),transparent 45%),radial-gradient(circle at 85% 90%,rgba(255,255,255,.03),transparent 45%)}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,textarea{font-family:inherit}
::-webkit-scrollbar{width:8px}::-webkit-scrollbar-thumb{background:#2a2a2a;border-radius:4px}
#login{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;background:#000}
.box{width:380px;padding:40px 32px;background:var(--bg1);border:1px solid var(--bd);border-radius:20px;box-shadow:0 20px 60px rgba(0,0,0,.8)}
.logo{width:70px;height:70px;margin:0 auto 20px;background:var(--grad);border-radius:18px;display:flex;align-items:center;justify-content:center}
.logo svg{width:36px;height:36px;stroke:#000;stroke-width:2.2;fill:none}
h1{text-align:center;font-size:24px;margin-bottom:6px}
h1 span{background:var(--grad);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.sub{text-align:center;color:var(--dim);font-size:13px;margin-bottom:26px}
label{display:block;font-size:11px;color:var(--dim);margin-bottom:6px;text-transform:uppercase;letter-spacing:.6px;font-weight:600}
input{width:100%;padding:12px 14px;background:var(--bg2);border:1px solid var(--bd);border-radius:10px;color:#fff;font-size:14px;outline:none;margin-bottom:14px}
input:focus{border-color:#555;background:var(--bg3)}
.btn{width:100%;padding:13px;border-radius:10px;background:var(--grad);color:#000;font-weight:700;font-size:14px}
.btn:hover{background:var(--gradh)}
.hint{text-align:center;color:var(--dim2);font-size:11px;margin-top:16px}
#app{display:none;width:100%;height:100%}
#app.on{display:flex}
.sb{width:280px;background:var(--bg1);border-right:1px solid var(--bd);display:flex;flex-direction:column;flex-shrink:0}
.sbh{padding:16px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--bd)}
.sbl{width:36px;height:36px;background:var(--grad);border-radius:10px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.sbl svg{width:20px;height:20px;stroke:#000;stroke-width:2.2;fill:none}
.sbh h2{font-size:15px;font-weight:800}
.sbh h2 span{background:var(--grad);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.sbh small{color:var(--dim);font-size:10px;display:block}
.nb{margin:12px;padding:11px;background:var(--bg3);border:1px solid var(--bd2);border-radius:10px;display:flex;align-items:center;gap:10px;font-size:13px;font-weight:600;color:#fff}
.nb:hover{background:var(--grad);color:#000}
.nb:hover svg{stroke:#000}
.nb svg{width:16px;height:16px;stroke:#fff;stroke-width:2.2;fill:none}
.cl{flex:1;overflow-y:auto;padding:4px 10px 12px}
.ci{padding:10px 12px;border-radius:9px;display:flex;align-items:center;gap:10px;font-size:13px;color:var(--dim);cursor:pointer;margin-bottom:2px;transition:.15s}
.ci:hover{background:var(--bg2);color:#fff}
.ci.on{background:var(--bg3);color:#fff}
.ci svg{width:14px;height:14px;stroke:currentColor;stroke-width:2;fill:none;flex-shrink:0}
.ci span{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ci .del{opacity:0;width:20px;height:20px;border-radius:5px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.ci:hover .del{opacity:1}
.ci .del:hover{background:rgba(255,77,77,.2)}
.ci .del svg{width:12px;height:12px}
.ci .del:hover svg{stroke:var(--red)}
.sbf{padding:14px;border-top:1px solid var(--bd);display:flex;align-items:center;gap:10px;font-size:12px}
.av{width:34px;height:34px;border-radius:50%;background:var(--grad);display:flex;align-items:center;justify-content:center;color:#000;font-weight:800;font-size:13px;flex-shrink:0}
.ui{flex:1;overflow:hidden}
.ui b{display:block;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ui small{color:var(--dim);font-size:10.5px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lb{width:30px;height:30px;border-radius:7px;display:flex;align-items:center;justify-content:center}
.lb:hover{background:rgba(255,77,77,.15)}
.lb svg{width:15px;height:15px;stroke:var(--dim);stroke-width:2;fill:none}
.lb:hover svg{stroke:var(--red)}
.mn{flex:1;display:flex;flex-direction:column;min-width:0}
.tb{padding:14px 20px;border-bottom:1px solid var(--bd);display:flex;align-items:center;gap:14px;background:rgba(10,10,10,.6)}
.ib{width:34px;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.ib:hover{background:var(--bg3)}
.ib svg{width:18px;height:18px;stroke:#fff;stroke-width:2;fill:none}
.tt{flex:1;min-width:0}
.tt h3{font-size:14.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tt small{color:var(--dim);font-size:11px}
.ms{display:flex;gap:6px;background:var(--bg2);padding:4px;border-radius:11px;border:1px solid var(--bd);overflow-x:auto}
.mb{padding:7px 12px;border-radius:8px;font-size:12px;font-weight:600;color:var(--dim);display:flex;align-items:center;gap:6px;white-space:nowrap}
.mb svg{width:13px;height:13px;stroke:currentColor;stroke-width:2.2;fill:none}
.mb:hover{color:#fff}
.mb.on{background:var(--grad);color:#000}
.mb.on svg{stroke:#000}
.ca{flex:1;overflow-y:auto;padding:28px 0}
.cin{max-width:820px;margin:0 auto;padding:0 24px}
.wc{text-align:center;padding:60px 20px}
.wcl{width:88px;height:88px;margin:0 auto 24px;background:var(--grad);border-radius:24px;display:flex;align-items:center;justify-content:center}
.wcl svg{width:46px;height:46px;stroke:#000;stroke-width:2.2;fill:none}
.wc h2{font-size:30px;font-weight:800;margin-bottom:10px}
.wc p{color:var(--dim);font-size:14px;margin-bottom:30px}
.sg{display:grid;grid-template-columns:1fr 1fr;gap:10px;max-width:560px;margin:0 auto}
.sgt{padding:14px;background:var(--bg1);border:1px solid var(--bd);border-radius:12px;text-align:left;font-size:12.5px;color:var(--dim);cursor:pointer;display:flex;align-items:center;gap:10px}
.sgt:hover{border-color:#444;background:var(--bg2);color:#fff}
.sgt svg{width:16px;height:16px;stroke:currentColor;stroke-width:2;fill:none;flex-shrink:0}
.mg{margin-bottom:24px;animation:mi .35s ease}
@keyframes mi{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.mu{display:flex;justify-content:flex-end}
.mu .bb{background:var(--bg3);border:1px solid var(--bd2);padding:12px 16px;border-radius:16px 16px 4px 16px;max-width:75%;font-size:14px;line-height:1.6;word-wrap:break-word;white-space:pre-wrap}
.ma{display:flex;gap:12px}
.ma .ava{width:34px;height:34px;border-radius:10px;background:var(--grad);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.ma .ava svg{width:19px;height:19px;stroke:#000;stroke-width:2.2;fill:none}
.ma .ct{flex:1;min-width:0;font-size:14px;line-height:1.7;padding-top:5px}
.ma .ct p{margin-bottom:10px}
.ma .ct p:last-child{margin-bottom:0}
.ma .ct ul,.ma .ct ol{margin:0 0 10px 22px}
.ma .ct li{margin-bottom:4px}
.ma .ct h1,.ma .ct h2,.ma .ct h3{margin:14px 0 8px;font-weight:700}
.ma .ct h1{font-size:20px}.ma .ct h2{font-size:17px}.ma .ct h3{font-size:15px}
.ma .ct code:not(pre code){background:var(--bg3);padding:2px 6px;border-radius:5px;font-size:12.5px;font-family:Consolas,Monaco,monospace}
.ma .ct a{color:#fff}
.ma .ct blockquote{border-left:3px solid #333;padding-left:12px;color:var(--dim);margin:10px 0}
.imgwrap{margin-top:10px}
.imgwrap img{max-width:100%;border-radius:10px;border:1px solid #222;display:block}
.imgbar{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.imgbtn{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:9px;background:var(--bg3);border:1px solid var(--bd2);color:#fff;font-size:12px;font-weight:600;text-decoration:none;transition:.15s}
.imgbtn:hover{background:var(--grad);color:#000;border-color:transparent}
.imgbtn:hover svg{stroke:#000}
.imgbtn svg{width:14px;height:14px;stroke:#fff;stroke-width:2;fill:none;transition:stroke .15s}
.cb{background:#0d0d0d;border:1px solid var(--bd2);border-radius:11px;overflow:hidden;margin:12px 0}
.ch{background:#151515;padding:9px 14px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--bd2)}
.clg{font-size:11px;color:var(--dim);font-family:Consolas,monospace;text-transform:uppercase;letter-spacing:.8px;font-weight:600}
.cpb{display:flex;align-items:center;gap:6px;padding:5px 10px;border-radius:7px;font-size:11px;font-weight:600;color:var(--dim)}
.cpb:hover{background:var(--bg3);color:#fff}
.cpb svg{width:13px;height:13px;stroke:currentColor;stroke-width:2;fill:none}
.cpb.cp{color:#4ade80}
.cpb.cp svg{stroke:#4ade80}
.cb pre{padding:16px;overflow-x:auto;font-size:13px;line-height:1.6;font-family:Consolas,Monaco,monospace;color:#e5e5e5}
.cb pre code{background:none;padding:0}
.ty{display:flex;gap:5px;padding:8px 0}
.ty span{width:7px;height:7px;background:var(--dim);border-radius:50%;animation:bn 1.4s infinite}
.ty span:nth-child(2){animation-delay:.2s}
.ty span:nth-child(3){animation-delay:.4s}
@keyframes bn{0%,60%,100%{transform:translateY(0);opacity:.4}30%{transform:translateY(-7px);opacity:1}}
.iw{padding:16px 24px 22px;background:linear-gradient(to top,#000 40%,transparent)}
.ibx{max-width:820px;margin:0 auto;background:var(--bg1);border:1px solid var(--bd2);border-radius:16px;padding:10px 10px 10px 18px;display:flex;align-items:flex-end;gap:10px}
.ibx:focus-within{border-color:#444}
.ibx textarea{flex:1;background:none;border:none;color:#fff;font-size:14px;resize:none;outline:none;max-height:180px;line-height:1.5;padding:8px 0}
.ibx textarea::placeholder{color:var(--dim2)}
.ibx textarea:disabled{opacity:.6;cursor:not-allowed}
.sb2{width:38px;height:38px;border-radius:11px;background:var(--grad);display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .2s}
.sb2:disabled{opacity:.3;cursor:not-allowed}
.sb2 svg{width:17px;height:17px;stroke:#000;stroke-width:2.4;fill:none}
.sb2.stop{background:linear-gradient(135deg,#ff6b6b,#cc2b2b)}
.sb2.stop:hover{background:linear-gradient(135deg,#ff5555,#b02020)}
.sb2.stop svg{stroke:#fff;width:15px;height:15px}
.if{max-width:820px;margin:8px auto 0;text-align:center;font-size:10.5px;color:var(--dim2)}
.mo{display:none}
@media(max-width:900px){.sb{position:fixed;left:0;top:0;bottom:0;z-index:50}.sb:not(.op){margin-left:-280px}.mo{display:flex}.mb span{display:none}.sg{grid-template-columns:1fr}}
</style>
</head>
<body>

<div id="login">
  <div class="box">
    <div class="logo"><svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2L3 7v10l9 5 9-5V7l-9-5z"/><path d="M12 22V12M3 7l9 5 9-5"/></svg></div>
    <h1>EXILED <span>AI</span></h1>
    <p class="sub">Entre para começar sua jornada</p>
    <label>Nome</label>
    <input type="text" id="ln" placeholder="Seu nome">
    <label>E-mail</label>
    <input type="email" id="le" placeholder="voce@email.com">
    <button class="btn" id="bl">Entrar no Exiled</button>
    <p class="hint">Salvo apenas neste navegador</p>
  </div>
</div>

<div id="app">
  <aside class="sb" id="sb">
    <div class="sbh">
      <div class="sbl"><svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2L3 7v10l9 5 9-5V7l-9-5z"/><path d="M12 22V12M3 7l9 5 9-5"/></svg></div>
      <div><h2>EXILED <span>AI</span></h2><small>Powered by Groq + Agnes</small></div>
    </div>
    <button class="nb" id="nn"><svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>Novo Chat</button>
    <div class="cl" id="cl"></div>
    <div class="sbf">
      <div class="av" id="av">?</div>
      <div class="ui"><b id="un">User</b><small id="ue">email</small></div>
      <button class="lb" id="lo"><svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4M16 17l5-5-5-5M21 12H9"/></svg></button>
    </div>
  </aside>
  <main class="mn">
    <div class="tb">
      <button class="ib mo" id="tg"><svg viewBox="0 0 24 24" stroke-linecap="round"><path d="M3 6h18M3 12h18M3 18h18"/></svg></button>
      <div class="tt"><h3 id="ct">Novo Chat</h3><small id="cs">Pronto para ajudar</small></div>
      <div class="ms" id="ms">
        <button class="mb on" data-m="normal"><svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg><span>Normal</span></button>
        <button class="mb" data-m="code"><svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><path d="M16 18l6-6-6-6M8 6l-6 6 6 6"/></svg><span>Código</span></button>
        <button class="mb" data-m="fast"><svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/></svg><span>Rápida</span></button>
        <button class="mb" data-m="think"><svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><path d="M9.5 2A2.5 2.5 0 0112 4.5v15a2.5 2.5 0 01-4.96.44 2.5 2.5 0 01-2.96-3.08 3 3 0 01-.34-5.58 2.5 2.5 0 011.32-4.24 2.5 2.5 0 011.98-3A2.5 2.5 0 019.5 2z"/><path d="M14.5 2A2.5 2.5 0 0112 4.5v15a2.5 2.5 0 004.96.44 2.5 2.5 0 002.96-3.08 3 3 0 00.34-5.58 2.5 2.5 0 00-1.32-4.24 2.5 2.5 0 00-1.98-3A2.5 2.5 0 0014.5 2z"/></svg><span>Pensar</span></button>
        <button class="mb" data-m="image"><svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg><span>Imagem</span></button>
      </div>
    </div>
    <div class="ca" id="ca"><div class="cin" id="cin"></div></div>
    <div class="iw">
      <div class="ibx">
        <textarea id="ui" placeholder="Pergunte qualquer coisa..." rows="1"></textarea>
        <button class="sb2" id="se"><svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z"/></svg></button>
      </div>
      <p class="if">EXILED AI pode cometer erros.</p>
    </div>
  </main>
</div>

<script>
(function(){
var K='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';
var U='https://api.groq.com/openai/v1/chat/completions';
var AK='sk-YHIGwJKI72lqvP0JBiIpdETWIM5qwdjt5Hq2zUq41A66pNf4';
var AU='https://apihub.agnes-ai.com/v1/images/generations';
var LK={u:'exu',c:'exc',n:'exn',m:'exm'};
var S={user:null,chats:{},cur:null,mode:'normal',busy:false,abort:null};
var M={
 normal:{model:'openai/gpt-oss-120b',temp:.7,sub:'Pronto para ajudar',p:'Você é a EXILED AI, assistente inteligente e amigável. Responda em português brasileiro. Use markdown quando fizer sentido.'},
 code:{model:'openai/gpt-oss-120b',temp:.3,sub:'Especialista em código',p:'Você é a EXILED AI no modo CÓDIGO. Engenheiro sênior. Sempre envie código em blocos markdown com a linguagem. Código completo e funcional. Português brasileiro.'},
 fast:{model:'openai/gpt-oss-20b',temp:.6,sub:'Respostas rápidas',p:'Você é a EXILED AI no modo RÁPIDO. Seja concisa e direta. Português brasileiro.'},
 think:{model:'openai/gpt-oss-120b',temp:.5,sub:'Pensar profundo',p:'Você é a EXILED AI no modo PENSAR. Analise com cuidado antes de responder. Português brasileiro.'},
 image:{model:'agnes-image-2.0-flash',temp:0,sub:'Gerar imagens com IA',p:''}
};
var SEND_ICON='<svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z"/></svg>';
var STOP_ICON='<svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round" fill="currentColor"><rect x="6" y="6" width="12" height="12" rx="2" stroke="none"/></svg>';

function $(id){return document.getElementById(id)}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;')}

function init(){
  try{
    var su=localStorage.getItem(LK.u);
    var sc=localStorage.getItem(LK.c);
    var sn=localStorage.getItem(LK.n);
    var sm=localStorage.getItem(LK.m);
    if(sc)S.chats=JSON.parse(sc);
    if(sn)S.cur=sn;
    if(sm&&M[sm])S.mode=sm;
    if(su){S.user=JSON.parse(su);enterApp();}
  }catch(e){console.log('init',e)}
  bindModes();
  bindInput();
  $('bl').addEventListener('click',doLogin);
  $('nn').addEventListener('click',newChat);
  $('lo').addEventListener('click',logout);
  $('se').addEventListener('click',onSendClick);
  $('tg').addEventListener('click',function(){ $('sb').classList.toggle('op'); });
}

function onSendClick(){
  if(S.busy){ stopResponse(); }
  else{ send(); }
}

function stopResponse(){
  if(S.abort){
    try{S.abort.abort();}catch(e){}
    S.abort=null;
  }
  S.busy=false;
  rmTyping();
  setBtnState(false);
  $('ui').disabled=false;
  $('ui').focus();
}

function setBtnState(busy){
  var b=$('se');
  if(busy){
    b.classList.add('stop');
    b.innerHTML=STOP_ICON;
    b.disabled=false;
    b.title='Parar resposta';
    $('ui').disabled=true;
  }else{
    b.classList.remove('stop');
    b.innerHTML=SEND_ICON;
    b.disabled=false;
    b.title='Enviar';
    $('ui').disabled=false;
  }
}

function updatePlaceholder(){
  var inp=$('ui');
  if(S.mode==='image') inp.placeholder='Descreva a imagem que quer gerar...';
  else inp.placeholder='Pergunte qualquer coisa...';
}

function doLogin(){
  var n=$('ln').value.trim();
  var e=$('le').value.trim();
  if(!n||!e){alert('Preencha nome e email');return}
  if(e.indexOf('@')<0){alert('Email inválido');return}
  S.user={name:n,email:e};
  try{localStorage.setItem(LK.u,JSON.stringify(S.user));}catch(x){}
  enterApp();
}

function enterApp(){
  $('login').style.display='none';
  $('app').classList.add('on');
  var u=S.user;
  $('un').textContent=u.name;
  $('ue').textContent=u.email;
  $('av').textContent=u.name.charAt(0).toUpperCase();
  if(!S.cur||!S.chats[S.cur]) newChat();
  else{renderList();renderChat();}
  updateModes();
  updatePlaceholder();
}

function logout(){
  if(!confirm('Sair?'))return;
  try{localStorage.removeItem(LK.u);}catch(x){}
  location.reload();
}

function newChat(){
  var id='c_'+Date.now();
  S.chats[id]={id:id,title:'Novo Chat',messages:[],t:Date.now()};
  S.cur=id;
  save();
  renderList();
  renderChat();
}

function save(){
  try{
    localStorage.setItem(LK.c,JSON.stringify(S.chats));
    localStorage.setItem(LK.n,S.cur||'');
  }catch(e){}
}

function switchChat(id){
  if(S.busy) stopResponse();
  S.cur=id;save();renderList();renderChat();
  if(innerWidth<=900)$('sb').classList.remove('op');
}

function delChat(id,e){
  e.stopPropagation();
  if(!confirm('Deletar?'))return;
  if(S.busy && S.cur===id) stopResponse();
  delete S.chats[id];
  if(S.cur===id){
    var k=Object.keys(S.chats);
    if(k.length)S.cur=k[0];else{newChat();return}
  }
  save();renderList();renderChat();
}

function renderList(){
  var list=$('cl');list.innerHTML='';
  var ids=Object.keys(S.chats).sort(function(a,b){return S.chats[b].t-S.chats[a].t});
  ids.forEach(function(id){
    var c=S.chats[id];
    var el=document.createElement('div');
    el.className='ci'+(id===S.cur?' on':'');
    el.onclick=function(){switchChat(id)};
    el.innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/></svg><span>'+esc(c.title)+'</span><div class="del"><svg viewBox="0 0 24 24" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4a2 2 0 012-2h4a2 2 0 012 2v2M19 6l-1 14a2 2 0 01-2 2H8a2 2 0 01-2-2L5 6"/></svg></div>';
    el.querySelector('.del').onclick=function(ev){delChat(id,ev)};
    list.appendChild(el);
  });
}

function renderChat(){
  var c=S.chats[S.cur];if(!c)return;
  $('ct').textContent=c.title;
  $('cs').textContent=M[S.mode].sub;
  updatePlaceholder();
  // reset do input
  $('ui').value='';
  $('ui').style.height='auto';
  $('ui').disabled=false;
  setBtnState(false);
  var cin=$('cin');cin.innerHTML='';
  if(!c.messages.length){welcome();return}
  c.messages.forEach(function(m){
    if(m.role==='assistant' && m.content.indexOf('<!--IMG-->')===0){
      addMsgRaw(m.content.replace('<!--IMG-->',''));
    } else {
      addMsg(m.role,m.content,false);
    }
  });
  scrollB();
}

function welcome(){
  var cin=$('cin');
  cin.innerHTML='<div class="wc"><div class="wcl"><svg viewBox="0 0 24 24" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2L3 7v10l9 5 9-5V7l-9-5z"/><path d="M12 22V12M3 7l9 5 9-5"/></svg></div><h2>Olá, '+esc(S.user.name.split(' ')[0])+' 👋</h2><p>Eu sou a <strong>EXILED AI</strong>. Como posso ajudar?</p><div class="sg"><div class="sgt" data-q="Explique computação quântica de forma simples"><svg viewBox="0 0 24 24" fill="none" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 015.83 1c0 2-3 3-3 3M12 17h.01"/></svg>Computação quântica</div><div class="sgt" data-q="Escreva uma função Python de web scraping"><svg viewBox="0 0 24 24" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M16 18l6-6-6-6M8 6l-6 6 6 6"/></svg>Web scraping Python</div><div class="sgt" data-q="Ideias de nomes para startup de IA"><svg viewBox="0 0 24 24" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18h6M10 22h4M12 2a7 7 0 00-4 12.7c.6.5 1 1.3 1 2.3h6c0-1 .4-1.8 1-2.3A7 7 0 0012 2z"/></svg>Nomes para startup</div><div class="sgt" data-q="Resuma a história da internet em 5 tópicos"><svg viewBox="0 0 24 24" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 016.5 17H20M4 19.5V6a2 2 0 012-2h14v13H6.5A2.5 2.5 0 004 19.5z"/></svg>História da internet</div></div></div>';
  cin.querySelectorAll('.sgt').forEach(function(el){
    el.onclick=function(){ $('ui').value=el.getAttribute('data-q'); send(); };
  });
}

function addMsg(role,content,anim){
  if(anim===undefined)anim=true;
  var cin=$('cin');
  var w=cin.querySelector('.wc');if(w)w.remove();
  var wrap=document.createElement('div');
  wrap.className='mg '+(role==='user'?'mu':'ma');
  if(!anim)wrap.style.animation='none';
  if(role==='user'){
    wrap.innerHTML='<div class="bb">'+esc(content)+'</div>';
  }else{
    wrap.innerHTML='<div class="ava"><svg viewBox="0 0 24 24" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2L3 7v10l9 5 9-5V7l-9-5z"/><path d="M12 22V12M3 7l9 5 9-5"/></svg></div><div class="ct">'+md(content)+'</div>';
  }
  cin.appendChild(wrap);
  return wrap;
}

function addMsgRaw(html){
  var cin=$('cin');
  var w=cin.querySelector('.wc');if(w)w.remove();
  var wrap=document.createElement('div');
  wrap.className='mg ma';
  wrap.innerHTML='<div class="ava"><svg viewBox="0 0 24 24" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2L3 7v10l9 5 9-5V7l-9-5z"/><path d="M12 22V12M3 7l9 5 9-5"/></svg></div><div class="ct">'+html+'</div>';
  cin.appendChild(wrap);
  return wrap;
}

function addTyping(){
  var cin=$('cin');
  var w=cin.querySelector('.wc');if(w)w.remove();
  var el=document.createElement('div');
  el.className='mg ma';el.id='tpy';
  el.innerHTML='<div class="ava"><svg viewBox="0 0 24 24" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2L3 7v10l9 5 9-5V7l-9-5z"/><path d="M12 22V12M3 7l9 5 9-5"/></svg></div><div class="ct"><div class="ty"><span></span><span></span><span></span></div></div>';
  cin.appendChild(el);
  scrollB();
}

function rmTyping(){var el=$('tpy');if(el)el.remove()}

function scrollB(){
  var a=$('ca');
  requestAnimationFrame(function(){a.scrollTop=a.scrollHeight});
}

function send(){
  if(S.busy)return;
  var inp=$('ui');
  var text=inp.value.trim();
  if(!text)return;
  var c=S.chats[S.cur];if(!c)return;

  if(c.messages.length===0){
    c.title=text.slice(0,40)+(text.length>40?'…':'');
    $('ct').textContent=c.title;
    renderList();
  }

  c.messages.push({role:'user',content:text});
  addMsg('user',text);
  save();
  inp.value='';inp.style.height='auto';
  S.busy=true;
  setBtnState(true);
  addTyping();

  if(S.mode==='image'){
    generateAgnesImage(text,c);
    return;
  }

  var ctrl=new AbortController();
  S.abort=ctrl;
  var m=M[S.mode];
  var msgs=[{role:'system',content:m.p}].concat(c.messages.map(function(x){return {role:x.role,content:x.content}}));
  fetch(U,{
    method:'POST',
    headers:{'Content-Type':'application/json','Authorization':'Bearer '+K},
    body:JSON.stringify({model:m.model,messages:msgs,temperature:m.temp,max_tokens:4096}),
    signal:ctrl.signal
  }).then(function(r){
    if(!r.ok)return r.text().then(function(t){throw new Error('HTTP '+r.status+': '+t)});
    return r.json();
  }).then(function(d){
    rmTyping();
    var rep=(d.choices&&d.choices[0]&&d.choices[0].message&&d.choices[0].message.content)||'(vazio)';
    c.messages.push({role:'assistant',content:rep});
    addMsg('assistant',rep);
    save();scrollB();
  }).catch(function(err){
    rmTyping();
    if(err.name==='AbortError'){
      addMsg('assistant','⏹️ *Resposta interrompida.*');
      scrollB();
    } else {
      addMsg('assistant','❌ **Erro**\n\n`'+esc(err.message)+'`');
      scrollB();
    }
  }).then(function(){
    S.abort=null;
    S.busy=false;
    setBtnState(false);
    inp.focus();
  });
}

function generateAgnesImage(prompt,chat){
  var ctrl=new AbortController();
  S.abort=ctrl;
  var body={
    model:'agnes-image-2.0-flash',
    prompt:prompt,
    size:'1024x1024',
    extra_body:{response_format:'url'}
  };
  fetch(AU,{
    method:'POST',
    headers:{'Content-Type':'application/json','Authorization':'Bearer '+AK},
    body:JSON.stringify(body),
    signal:ctrl.signal
  }).then(function(r){
    if(!r.ok)return r.text().then(function(t){throw new Error('HTTP '+r.status+': '+t)});
    return r.json();
  }).then(function(data){
    rmTyping();
    var imgUrl=data.data&&data.data[0]&&(data.data[0].url||('data:image/png;base64,'+data.data[0].b64_json));
    if(!imgUrl)throw new Error('Nenhuma URL retornada.');
    var safePrompt=esc(prompt);
    var filename='exiled-'+Date.now()+'.png';
    var html='<p>🖼️ <em>'+safePrompt+'</em></p>'+
      '<div class="imgwrap">'+
        '<img src="'+imgUrl+'" alt="'+safePrompt+'" data-filename="'+filename+'" class="genimg">'+
        '<div class="imgbar">'+
          '<a class="imgbtn" href="'+imgUrl+'" download="'+filename+'" target="_blank" rel="noopener">'+
            '<svg viewBox="0 0 24 24" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4M7 10l5 5 5-5M12 15V3"/></svg>'+
            'Baixar'+
          '</a>'+
          '<button class="imgbtn" onclick="copyImgUrl(this)" data-url="'+imgUrl+'">'+
            '<svg viewBox="0 0 24 24" fill="none" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/></svg>'+
            'Copiar URL'+
          '</button>'+
          '<a class="imgbtn" href="'+imgUrl+'" target="_blank" rel="noopener">'+
            '<svg viewBox="0 0 24 24" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 01-2 2H5a2 2 0 01-2-2V8a2 2 0 012-2h6M15 3h6v6M10 14L21 3"/></svg>'+
            'Abrir'+
          '</a>'+
        '</div>'+
      '</div>';
    var stored='<!--IMG-->'+html;
    chat.messages.push({role:'assistant',content:stored});
    addMsgRaw(html);
    save();scrollB();
  }).catch(function(err){
    rmTyping();
    if(err.name==='AbortError'){
      addMsg('assistant','⏹️ *Geração interrompida.*');
      scrollB();
    } else {
      addMsg('assistant','❌ **Erro ao gerar imagem**\n\n`'+esc(err.message)+'`');
      scrollB();
    }
  }).then(function(){
    S.abort=null;
    S.busy=false;
    setBtnState(false);
    $('ui').focus();
  });
}

window.copyImgUrl=function(btn){
  var url=btn.getAttribute('data-url');
  if(!url)return;
  if(navigator.clipboard){
    navigator.clipboard.writeText(url).then(function(){
      var old=btn.innerHTML;
      btn.innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>Copiado!';
      setTimeout(function(){btn.innerHTML=old},1500);
    });
  }
};

function md(text){
  var html=esc(text);
  var cb=[];
  html=html.replace(/```(\w*)\n([\s\S]*?)```/g,function(m,lang,code){
    var i=cb.length;cb.push({lang:lang||'code',code:code.trim()});
    return '\u0000C'+i+'\u0000';
  });
  html=html.replace(/`([^`]+)`/g,'<code>$1</code>');
  html=html.replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>');
  html=html.replace(/(^|[^*])\*([^*\n]+)\*/g,'$1<em>$2</em>');
  html=html.replace(/^### (.+)$/gm,'<h3>$1</h3>');
  html=html.replace(/^## (.+)$/gm,'<h2>$1</h2>');
  html=html.replace(/^# (.+)$/gm,'<h1>$1</h1>');
  html=html.replace(/^&gt; (.+)$/gm,'<blockquote>$1</blockquote>');
  html=html.replace(/\[([^\]]+)\]\((https?:\/\/[^\)]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>');
  var lines=html.split('\n');
  var out=[],inUl=false,inOl=false;
  for(var k=0;k<lines.length;k++){
    var line=lines[k];
    if(/^\s*[-*] (.+)/.test(line)){
      if(!inUl){if(inOl){out.push('</ol>');inOl=false}out.push('<ul>');inUl=true}
      out.push('<li>'+line.replace(/^\s*[-*] /,'')+'</li>');
    }else if(/^\s*\d+\. (.+)/.test(line)){
      if(!inOl){if(inUl){out.push('</ul>');inUl=false}out.push('<ol>');inOl=true}
      out.push('<li>'+line.replace(/^\s*\d+\. /,'')+'</li>');
    }else{
      if(inUl){out.push('</ul>');inUl=false}
      if(inOl){out.push('</ol>');inOl=false}
      out.push(line);
    }
  }
  if(inUl)out.push('</ul>');
  if(inOl)out.push('</ol>');
  html=out.join('\n');
  html=html.split(/\n{2,}/).map(function(b){
    var t=b.trim();if(!t)return '';
    if(/^<(h[1-3]|ul|ol|blockquote|pre|div|img|p)/.test(t))return t;
    if(t.indexOf('\u0000C')!==-1)return t;
    return '<p>'+t.replace(/\n/g,'<br>')+'</p>';
  }).join('\n');
  html=html.replace(/\u0000C(\d+)\u0000/g,function(m,i){
    var o=cb[+i];
    var id='code_'+Math.random().toString(36).slice(2,9);
    return '<div class="cb"><div class="ch"><span class="clg">'+esc(o.lang)+'</span><button class="cpb" data-c="'+id+'"><svg viewBox="0 0 24 24" fill="none" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/></svg>Copiar</button></div><pre><code id="'+id+'">'+esc(o.code)+'</code></pre></div>';
  });
  return html;
}

document.addEventListener('click',function(e){
  var b=e.target.closest && e.target.closest('.cpb');
  if(!b)return;
  var id=b.getAttribute('data-c');
  var el=$(id);if(!el)return;
  var txt=el.textContent;
  if(navigator.clipboard){
    navigator.clipboard.writeText(txt).then(function(){
      b.classList.add('cp');
      b.innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>Copiado!';
      setTimeout(function(){
        b.classList.remove('cp');
        b.innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/></svg>Copiar';
      },1800);
    });
  }else{
    var ta=document.createElement('textarea');ta.value=txt;document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove();
    b.textContent='Copiado!';
  }
});

function bindModes(){
  document.querySelectorAll('.mb').forEach(function(b){
    b.addEventListener('click',function(){
      if(S.busy) stopResponse();
      var m=b.getAttribute('data-m');
      if(!M[m])return;
      S.mode=m;
      try{localStorage.setItem(LK.m,m)}catch(x){}
      updateModes();
      $('cs').textContent=M[m].sub;
      updatePlaceholder();
      $('ui').focus();
    });
  });
}

function updateModes(){
  document.querySelectorAll('.mb').forEach(function(b){
    b.classList.toggle('on',b.getAttribute('data-m')===S.mode);
  });
}

function bindInput(){
  var i=$('ui');
  i.addEventListener('input',function(){
    i.style.height='auto';
    i.style.height=Math.min(i.scrollHeight,180)+'px';
  });
  i.addEventListener('keydown',function(e){
    if(e.key==='Enter'&&!e.shiftKey){
      e.preventDefault();
      if(!S.busy) send();
    }
  });
}

if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',init);
else init();
})();
